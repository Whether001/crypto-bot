name: Deploy pc bot

on:
  push:
    branches: [main]
    paths:
      - "pc-bot/**"
      - ".github/workflows/deploy-pc.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Загрузить воркер в Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pc-bot
          secrets: |
            TELEGRAM_TOKEN
        env:
          TELEGRAM_TOKEN: ${{ secrets.PC_TELEGRAM_TOKEN }}

      - name: Подключить Telegram к воркеру
        env:
          TELEGRAM_TOKEN: ${{ secrets.PC_TELEGRAM_TOKEN }}
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "Не получил адрес воркера. Открой шаг выше и посмотри адрес вида https://pc-remote.имя.workers.dev"
            exit 1
          fi
          echo "Адрес воркера: $WORKER_URL"
          SECRET=$(printf '%s' "$TELEGRAM_TOKEN" | sha256sum | cut -c1-48)
          curl -sS --fail "https://api.telegram.org/bot${TELEGRAM_TOKEN}/setWebhook" \
            --data-urlencode "url=${WORKER_URL}" \
            --data-urlencode "secret_token=${SECRET}"
          echo
