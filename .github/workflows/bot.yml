name: Crypto bot

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub может чуть опаздывать)
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить цены
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - name: Сохранить состояние
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "crypto-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git commit -m "Обновить состояние"
            git push
          fi
